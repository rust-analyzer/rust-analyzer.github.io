name: Typos

on:
  workflow_dispatch:
  push:
    branches: [src]
  pull_request:
    branches: [src]

permissions: {}

jobs:
  typos:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3
